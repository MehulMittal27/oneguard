# Model responses for the compiler's LLM path on the five public instructions (lane P4).
# TEST DATA ONLY: read by backend/tests/test_compiler_recorded.py, never by oneguard/.
#
# Each `response` is the provider's JSON output (compiler/llm.py SCHEMA) for `instruction`.
# These were written in that format by hand, not captured from a live model: no API key
# was available when this file was made. `public_2_reviewed_run` reproduces the defects
# the P4-1 review saw on a real run. To refresh with captured output, replace a `response`
# block and keep `expect`.
#
# expect.kinds: the kinds of restriction the shipped draft holds (compiler.lint.coverage);
# expect.on_fail: every rule's on_fail; expect.compiler: llm | fallback.
- label: public_0
  instruction: Buy one ordinary grocery item for CHF 20 or less from a shop I use regularly. Ask me when uncertain.
  response:
    uncertainty_policy: ask
    requested_item: null
    nothing_extra: false
    rules:
    - field: authorization.billing_amount_chf
      operator: <=
      value_number: 20
      value_text: null
      value_list: null
      value_from: literal
      currency: CHF
      scope: purchase
      period_days: null
      words: for CHF 20 or less
      source: exact
      on_fail: decline
    - field: items[].item_category
      operator: in
      value_number: null
      value_text: null
      value_list:
      - groceries
      value_from: literal
      currency: null
      scope: null
      period_days: null
      words: ordinary grocery item
      source: inferred
      on_fail: decline
    - field: merchant.familiar_on_card
      operator: '='
      value_number: null
      value_text: 'true'
      value_list: null
      value_from: literal
      currency: null
      scope: null
      period_days: null
      words: from a shop I use regularly
      source: inferred
      on_fail: decline
    open_questions: []
  expect:
    compiler: llm
    kinds:
    - C1
    - C3
    - C9
    uncertainty_policy: ask
    on_fail: decline
