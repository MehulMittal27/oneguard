# Runs on every PR and every push to main. Red CI blocks merges (team contract §2).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ui
        run: test -f frontend/package.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"
      - if: steps.ui.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.ui.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - if: steps.ui.outputs.present == 'true'
        working-directory: frontend
        run: npm run build
      - if: steps.ui.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint
