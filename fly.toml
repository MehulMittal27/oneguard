# One machine in London (nearest the Supabase project in AWS eu-west-1, docs/database.md
# §5.2), no volume: state lives in Supabase via ONEGUARD_DATABASE_URL. Secrets
# (VISECA_API_KEY, OPENAI_API_KEY, ONEGUARD_DATABASE_URL, ...) are Fly secrets.
# The worker long-polls Viseca from inside the app, so the machine never auto-stops.
# ONEGUARD_LOG_VISECA_CALLS stays unset (no viseca_calls rows); set it only to debug.
# Keyword soft signals only: the Fly secret ONEGUARD_SOFT_SIGNALS=keywords overrides the
# image's laya default, because on Fly's CPUs Laya does not answer a purchase inside its
# budget (docs/benchmark.md §3), so 1 GB is enough. Turning Laya on needs 4 GB first
# (the model alone is ~2 GB resident) and then `fly secrets unset ONEGUARD_SOFT_SIGNALS`;
# it then loads in the background at startup while the worker polls with keywords.
app = "oneguard"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

# One machine: a rolling deploy has nothing to roll over to, and Fly's health-check wait
# only delays the new machine. It polls Viseca as soon as the app is up (the model loads
# in the background, api/app.py), so the gap between the old worker and the new is the
# container start.
[deploy]
  strategy = "immediate"

[env]
  PORT = "8080"
  ONEGUARD_ENV = "prod"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "120s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
