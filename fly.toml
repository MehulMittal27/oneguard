# One machine in London (nearest the Supabase project in AWS eu-west-1, docs/database.md
# §5.2), no volume: state lives in Supabase via ONEGUARD_DATABASE_URL. Secrets
# (VISECA_API_KEY, OPENAI_API_KEY, ONEGUARD_DATABASE_URL, ...) are Fly secrets.
# The worker long-polls Viseca from inside the app, so the machine never auto-stops.
# ONEGUARD_LOG_VISECA_CALLS stays unset (no viseca_calls rows); set it only to debug.
# 4 GB: the Laya checkpoint baked into the image (Dockerfile) is loaded once at startup and
# answers agent_directed on the machine's CPUs. Dedicated CPUs: shared ones run out of burst
# balance after a few hundred model calls and then throttle (docs/benchmark.md §3).
app = "oneguard"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ONEGUARD_ENV = "prod"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "120s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "performance-2x"
  memory = "4gb"
