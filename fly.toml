# One machine in London (nearest the Supabase project in AWS eu-west-1, docs/database.md
# §5.2), no volume: state lives in Supabase via ONEGUARD_DATABASE_URL. Secrets
# (VISECA_API_KEY, OPENAI_API_KEY, ONEGUARD_DATABASE_URL, ...) are Fly secrets.
# The worker long-polls Viseca from inside the app, so the machine never auto-stops.
app = "oneguard"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ONEGUARD_ENV = "prod"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
