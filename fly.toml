# One machine in London (nearest the Supabase project in AWS eu-west-1, docs/database.md
# §5.2), no volume: state lives in Supabase via ONEGUARD_DATABASE_URL. Secrets
# (VISECA_API_KEY, OPENAI_API_KEY, ONEGUARD_DATABASE_URL, ...) are Fly secrets.
# The worker long-polls Viseca from inside the app, so the machine never auto-stops.
# ONEGUARD_LOG_VISECA_CALLS stays unset (no viseca_calls rows); set it only to debug.
# Laya soft signals on performance-2x (docs/decisions.md 2026-09-25): Fly secrets
# ONEGUARD_SOFT_SIGNALS=laya and ONEGUARD_SIGNAL_BUDGET_MS=1500 (per-purchase P95 1.3-1.5 s
# there, docs/benchmark.md §3); past the budget the keyword answer stands. The model is
# ~2 GB resident, so 4 GB; it loads in the background at startup while the worker polls
# with keywords. `fly deploy` applies the [[vm]] below, so a manual scale must match it.
app = "oneguard"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

# One machine: a rolling deploy has nothing to roll over to, and Fly's health-check wait
# only delays the new machine. It polls Viseca as soon as the app is up (the model loads
# in the background, api/app.py), so the gap between the old worker and the new is the
# container start.
[deploy]
  strategy = "immediate"

[env]
  PORT = "8080"
  ONEGUARD_ENV = "prod"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "120s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "performance-2x"
  memory = "4gb"
