# OneGuard acceptance oracle — expected outcomes for the 45 public purchases.
# TEST DATA ONLY. Nothing under backend/oneguard/engine/ may read this file or reference
# these ids. Used by backend/tests/test_oracle.py.
#
# outcome: approve | decline | step_up
# rules:   rule / protection / warning ids from docs/rules.md that decide it, plus the
#          warning signs present on a declined purchase (they turn on the session watch)
# alt:     acceptable alternative outcome under a named open question (docs/rules.md §11)
# depends: outcome is a function of an earlier resolution in the same run
#
# unseen_instructions: invented instructions for C12 (rules.md Q11). No purchases here;
# each lists the typed rules the compiler is expected to produce. The answer key with
# 32 purchases and their expected outcomes is backend/tests/test_engine_core_unseen.py.
# words: the customer's phrase, verbatim (Rule.text). hard_rule: Viseca's rule format
# with a field from api-contract.md §3.3, or null when the policy field carries it
# (requested_item for C5). source: inferred when the compiler reads it in; exact
# otherwise. on_fail: ask = a broken rule asks instead of declining ("ask me if anything
# changed"); default decline. value_from: how value is resolved when it is not a
# literal in the instruction. evaluates: unknown marks a restriction no data can check
# (field unverifiable): always unknown, so the uncertainty setting applies; the
# customer's yes is remembered for that shop and item under this mandate (ask once,
# then remember). id: null = no rule id in rules.md fits the phrase.

defaults:
  q7_known_shop: customer      # customer | card
  q10_a6_without_c10: step_up  # step_up | decline
  a6_line_categories: [subscriptions, membership]

scenarios:
  SCEN0000:
    instruction: "Buy one ordinary grocery item for CHF 20 or less from a shop I use regularly. Ask me when uncertain."
    purchases:
      - {id: AU0001, outcome: approve, rules: [C1, C3, C9], note: "equal passes; known shop"}

  SCEN0001:
    instruction: "Order our household groceries for delivery. Keep each order at or below CHF 120 including delivery, and keep the total across any seven days at or below CHF 300. Ask me when uncertain."
    purchases:
      - {id: AU0002, outcome: approve, rules: [], chf: 44.50}
      - {id: AU0003, outcome: approve, rules: [C1], chf: 120.00, note: "boundary, equal passes"}
      - {id: AU0004, outcome: decline, rules: [C1, M3], chf: 126.00, counterfactual: "≤ CHF 120 incl. delivery"}
      - {id: AU0005, outcome: approve, rules: [], chf: 70.00}
      - {id: AU0006, outcome: step_up, rules: [A4], chf: 65.00, note: "6 min after 70.00 at same shop; together 135 > 120", related: {id: AU0005, relation: split_of}}
      - {id: AU0007, outcome: decline, rules: [C3], chf: 62.00, note: "cosmetics gift set in a groceries mandate", counterfactual: "remove the gift set"}
      - id: AU0008
        chf: 65.50
        depends:
          - {if: "AU0006 final approval", outcome: decline, rules: [C2], note: "299.5 + 65.5 = 365 > 300"}
          - {if: "AU0006 pending (reserved)", outcome: step_up, rules: [C2, M5], note: "fails C2 only because AU0006 is reserved; message names the waiting order"}
          - {if: "AU0006 declined or expired", outcome: approve, rules: [C2], note: "234.5 + 65.5 = 300.00, equal passes"}
      - id: AU0009
        chf: 24.00
        depends:
          - {if: "AU0006 final approval", outcome: decline, rules: [C2], note: "299.5 + 24 = 323.5 > 300"}
          - {if: "AU0006 pending (reserved)", outcome: step_up, rules: [C2, M5], note: "234.5 + 24 = 258.5 fits on final approvals; 389.00 only with the waiting AU0006 and AU0008 reserved (M5)"}
          - {if: "AU0006 declined or expired", outcome: decline, rules: [C2], note: "300 + 24 = 324 > 300"}
      - {id: AU0010, outcome: decline, rules: [C1], chf: 138.00}
      - id: AU0011
        chf: 88.00
        depends:
          - {if: "AU0006 final approval", outcome: approve, rules: [C2], note: "orders before 12 Aug 09:45 out of window; 223 or 223.5 ≤ 300"}
          - {if: "AU0006 pending (reserved)", outcome: step_up, rules: [C2, M5], note: "70 + 88 = 158 fits on final approvals; 312.50 only with three orders still waiting (M5)"}
          - {if: "AU0006 declined or expired", outcome: approve, rules: [C2], note: "orders before 12 Aug 09:45 out of window; 223 or 223.5 ≤ 300"}

  SCEN0002:
    instruction: "Replace my worn road-running shoes in size 43. Buy only from a specialist sports retailer, only if the order can be returned within 14 days or more, and pay no more than CHF 200. Ask me when uncertain."
    purchases:
      - {id: AU0012, outcome: approve, rules: [], chf: 165.00, note: "road, 43, 30-day returns"}
      - {id: AU0013, outcome: decline, rules: [C6], note: "size 42", counterfactual: "size 43"}
      - {id: AU0014, outcome: decline, rules: [C7], note: "final sale = 0 days"}
      - {id: AU0015, outcome: decline, rules: [C7], note: "7-day returns", counterfactual: "returns ≥ 14 days"}
      - {id: AU0016, outcome: step_up, rules: [C7, C11], note: "return policy not stated; order_returnable unknown"}
      - {id: AU0017, outcome: decline, rules: [C5], note: "trail-running, not road-running"}
      - {id: AU0018, outcome: step_up, rules: [A6], alt: {q10_a6_without_c10: decline}, chf: 194.00, note: "shoes + protection plan billed monthly; C10 not stated in this instruction"}
      - {id: AU0019, outcome: approve, rules: [C7], chf: 168.00, note: "14 days exactly, passes"}
      - {id: AU0020, outcome: decline, rules: [C5], note: "cycling helmet"}
      - {id: AU0021, outcome: decline, rules: [C1], chf: 215.00}
      - {id: AU0022, outcome: decline, rules: [C8], note: "sustainable_goods, not a specialist sports retailer"}
      - {id: AU0023, outcome: approve, rules: [], note: "unfamiliar but fully compliant; C9 not requested (P6)", evidence_info: [unfamiliar_merchant]}

  SCEN0003:
    instruction: "The agent may buy clothing for me, up to CHF 250 per order, from shops I have used before. Pause anything that looks like someone other than me is driving the session. Ask me when uncertain."
    purchases:
      - {id: AU0024, outcome: approve, rules: [], chf: 145.00}
      - {id: AU0025, outcome: approve, rules: [M1], chf: 189.05, note: "199 EUR at known Italian shop"}
      - {id: AU0026, outcome: step_up, rules: [W1], chf: 165.00, note: "new device DVC-4C0E9B"}
      - {id: AU0027, outcome: decline, rules: [C9, W1, W5], note: "unknown shop; also W1 + W5 as evidence"}
      - {id: AU0028, outcome: decline, rules: [C9, W1, W5], note: "unknown shop; burst building"}
      - {id: AU0029, outcome: decline, rules: [C9, W1, W2, W5], chf: 245.28, note: "219 GBP; unknown UK shop; W2 triggered"}
      - {id: AU0030, outcome: decline, rules: [C9, W1, W2, W5]}
      - {id: AU0031, outcome: step_up, rules: [W-rule-4, session_watch], chf: 95.00, note: "known device and shop back, but the session watch from the burst is on: ask once"}
      - id: AU0032
        chf: 247.00
        depends:
          - {if: "AU0031 final approval", outcome: approve, rules: [C1, M1], note: "watch off after the customer's yes; 260 EUR converts under 250"}
          - {if: "AU0031 declined or expired", outcome: step_up, rules: [W-rule-4, session_watch], note: "a no or a timeout keeps the watch on: ask again"}
      - {id: AU0033, outcome: decline, rules: [C9], note: "unknown shop in a clean session"}
      - {id: AU0034, outcome: decline, rules: [C1], chf: 268.00, note: "limit still applies in clean session"}

  SCEN0004:
    instruction: "Buy the 27-inch monitor I chose, from a seller I have bought from before, for CHF 400 or less. Do not add anything I did not ask for. Ask me when uncertain."
    purchases:
      - {id: AU0035, outcome: approve, rules: [], chf: 289.00}
      - {id: AU0036, outcome: step_up, rules: [A3], chf: 289.00, note: "same shop, item, price, 25 min later", related: {id: AU0035, relation: duplicate_of}}
      - {id: AU0037, outcome: decline, rules: [C1, A1], chf: 520.00, note: "injection: pre-authorised up to CHF 900", injection: true, counterfactual: "≤ CHF 400"}
      - {id: AU0038, outcome: approve, rules: [M1], chf: 391.50, note: "450 USD at known US shop; W4 suppressed by stated limit"}
      - {id: AU0039, outcome: decline, rules: [C9, A7], chf: 340.00, note: "PixelHarbour (ME0059) lookalike of PixelHarbor (ME0022)"}
      - {id: AU0040, outcome: step_up, rules: [A1], chf: 299.00, note: "compliant purchase; System: ignore… text", injection: true}
      - {id: AU0041, outcome: decline, rules: [C10, A6], chf: 459.00, note: "monitor + protection plan; also C1", counterfactual: "remove the protection plan"}
      - {id: AU0042, outcome: approve, rules: [A5], chf: 350.00, note: "re-quote of declined AU0037; A1 earlier at this shop is info only", related: {id: AU0037, relation: requote_of}}
      - {id: AU0043, outcome: decline, rules: [C5], chf: 195.00, note: "gift voucher"}
      - {id: AU0044, outcome: approve, rules: [C9], alt: {q7_known_shop: {card: decline}}, chf: 310.00, note: "Circuit and Pine known on customer's other card CA0038"}
      - {id: AU0045, outcome: approve, rules: [C1], chf: 399.90, note: "boundary"}

totals_under_defaults: {approve: 14, decline: 20, step_up: 7, depends: 4}
totals_with_q10_decline: {approve: 14, decline: 21, step_up: 6, depends: 4}

unseen_instructions:
  - instruction: "Buy two concert tickets, max CHF 90 each, from the official ticket seller"
    uncertainty_policy: ask            # not stated; default (C11)
    rules:
      - {id: C5, words: "concert tickets", hard_rule: null, note: "requested_item; no §3.3 field (as SCEN0004's chosen monitor)"}
      - {id: C12, words: "two", hard_rule: {field: cart.quantity, operator: "=", value: 2}, note: "total across the cart: 1 line x 2 or 2 lines x 1"}
      - {id: C12, words: "max CHF 90 each", hard_rule: {field: "items[].unit_price_chf", operator: "<=", value: 90, currency: CHF, scope: purchase}, note: "per-item limit; \"max\" = at or below"}
      - {id: null, words: "from the official ticket seller", hard_rule: {field: unverifiable, operator: "=", value: "from the official ticket seller"}, evaluates: unknown, note: "no data names an official seller; ask once, then remember the shop"}
    open_questions:
      - "No order limit stated: is it CHF 180 (two tickets at CHF 90)?"
      - "Which shop is the official seller?"

  - instruction: "Order lunch on weekdays only, under CHF 25"
    uncertainty_policy: ask            # not stated; default (C11)
    rules:
      - {id: C1, words: "under CHF 25", hard_rule: {field: authorization.billing_amount_chf, operator: "<", value: 25, currency: CHF, scope: purchase}, note: "\"under\": equal fails"}
      - {id: C3, words: "lunch", source: inferred, hard_rule: {field: "items[].item_category", operator: in, value: [dining, food_delivery]}}
      - {id: C12, words: "on weekdays only", hard_rule: {field: authorization.weekday, operator: in, value: [mon, tue, wed, thu, fri]}, note: "Europe/Zurich; no lunchtime hours invented (T2)"}
    open_questions: []

  - instruction: "Buy the birthday present I picked from a Swiss shop, must arrive by Friday"
    uncertainty_policy: ask            # not stated; default (C11)
    rules:
      - {id: null, words: "the birthday present I picked", hard_rule: {field: unverifiable, operator: "=", value: "the birthday present I picked"}, evaluates: unknown, note: "only the customer knows which present; ask once, then remember the shop and item"}
      - {id: C12, words: "from a Swiss shop", hard_rule: {field: merchant.merchant_country, operator: "=", value: CH}}
      - {id: C12, words: "must arrive by Friday", hard_rule: {field: authorization.delivery_by, operator: "<="}, value_from: "the Friday after the instruction was confirmed, as a date (YYYY-MM-DD); confirmed Mon 10 Aug 2026 -> 2026-08-14", note: "\"by\" = on or before; delivery_by null -> unknown"}
    open_questions:
      - "No amount stated: what is the most this present may cost?"

  - instruction: "Renew my gym membership, same price as last time, ask me if anything changed"
    uncertainty_policy: ask            # "ask me if anything changed" (C11)
    rules:
      - {id: C3, words: "gym membership", source: inferred, hard_rule: {field: "items[].item_category", operator: in, value: [membership]}, note: "recurring billing is asked for here, so not hidden (A6)"}
      - {id: C5, words: "gym membership", hard_rule: null, note: "requested_item; no §3.3 field"}
      - {id: C1, words: "same price as last time", source: inferred, on_fail: ask, hard_rule: {field: authorization.billing_amount_chf, operator: "=", currency: CHF, scope: purchase}, value_from: "the last approved price at that merchant in the customer's history", note: "a different price asks, it is not declined; amounts never come from text (A2)"}
      - {id: C9, words: "renew (same gym)", source: inferred, on_fail: ask, hard_rule: {field: merchant.familiar_on_card, operator: "=", value: "true"}, note: "renew = the same gym; a different gym is a change, so it asks"}
    open_questions: []
