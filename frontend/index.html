<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2F5F6" />
    <meta name="description" content="Wallet control layer for an AI shopping agent — set, review and control what it may spend." />
    <!--
      Instrument Sans is the single family the recalibrated Ink and signal theme
      uses for both body and display (src/styles/tokens.css). Until now no face
      was ever loaded, so the app fell back to Avenir Next / system-ui and the
      design system's type scale never actually rendered. Loaded as a stylesheet
      link, not an npm dependency.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>OneGuard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
